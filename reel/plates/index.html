<!doctype html>
<html><head><meta charset="utf-8"><title>Zuzone reel plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#FAF6EC;font-family:'DM Sans',sans-serif}
.abs{position:absolute}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.name{position:absolute;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:-1px;line-height:1;white-space:nowrap}
.cap{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:900px;padding:22px 44px;border-radius:40px;background:#FAF6EC;color:#1F4D3A;font-family:'DM Sans',sans-serif;font-weight:600;font-size:52px;line-height:1.2;text-align:center;box-shadow:0 10px 36px rgba(31,77,58,.16)}
.cap u{text-decoration:none;background:linear-gradient(transparent 68%, #C4D63E 68%)}
</style></head><body><div id="stage"></div>
<script>
const FOREST='#1F4D3A',CREAM='#FAF6EC',LIME='#C4D63E';
const ZP="M57 13 438 600Q441 605 440.5 606.5Q440 608 433 608Q347 608 288.0 606.5Q229 605 191.5 599.0Q154 593 131.0 580.0Q108 567 93.5 546.0Q79 525 66 491Q65 489 59.0 490.0Q53 491 54 494L94 655Q95 657 101.0 656.0Q107 655 106 653Q103 635 114.0 630.0Q125 625 163 625Q223 625 310.0 625.0Q397 625 528 625Q533 625 535.0 620.5Q537 616 535 612L158 27Q154 22 155.0 20.5Q156 19 163 19Q241 19 302.5 19.0Q364 19 401 19Q444 19 475.0 33.0Q506 47 526.0 74.5Q546 102 553 140Q554 143 559.0 143.0Q564 143 564 140L550 8Q550 5 548.0 1.5Q546 -2 541 -2Q467 -1 384.5 -0.5Q302 0 219.5 0.0Q137 0 62 0Q58 0 56.0 4.5Q54 9 57 13Z";
const UP="M185 -9Q134 -9 104.5 23.5Q75 56 75 114V265Q75 303 68.5 320.0Q62 337 45 337Q32 337 14 328Q10 326 7.5 332.0Q5 338 9 339L127 394Q129 395 131 395Q135 395 139.0 392.0Q143 389 143 385V152Q143 94 163.5 66.5Q184 39 226 39Q262 39 297.5 60.0Q333 81 358 115L363 104Q321 48 277.5 19.5Q234 -9 185 -9ZM407 385V110Q407 76 414.5 61.0Q422 46 440 46Q449 46 460.5 49.5Q472 53 489 60Q493 62 495.5 56.5Q498 51 495 49L371 -10Q369 -11 366 -11Q358 -11 348.5 11.5Q339 34 339 76V265Q339 303 332.0 320.0Q325 337 309 337Q296 337 277 328Q274 326 271.5 332.0Q269 338 273 339L391 394Q393 395 395 395Q398 395 402.5 392.0Q407 389 407 385Z";
let W=1080,H=1920; const WIDE=()=>W>H;
window.setStage=function(w,h){W=w;H=h;const st=document.getElementById('stage');st.style.width=w+'px';st.style.height=h+'px';};
function textW(txt,font){const c=document.createElement('canvas').getContext('2d');c.font=font;return c.measureText(txt).width;}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const easeOut=k=>1-Math.pow(1-k,3);
function dots(){return Array.from({length:12},(_,i)=>{const a=(-90+30*i)*Math.PI/180;return [180+137*Math.cos(a),180+137*Math.sin(a)]})}
function ring(o){
  const size=o.size||600, color=o.color||FOREST; const act=o.active??-1, prev=o.prev??-1, frac=o.frac??1;
  const scales=o.scales||Array(12).fill(1); const zu=o.zu??1;
  let s=`<svg viewBox="0 0 360 360" width="${size}" height="${size}" style="display:block">`;
  dots().forEach(([cx,cy],i)=>{
    let r=8, fill=color;
    if(i===act){ r=8+9*easeOut(frac); fill=LIME; }
    else if(i===prev){ r=17-9*easeOut(frac); fill = frac<0.5? LIME : color; }
    r*=scales[i]; if(r<=0.05) return;
    s+=`<circle cx="${cx.toFixed(3)}" cy="${cy.toFixed(3)}" r="${r.toFixed(2)}" fill="${fill}"/>`;
  });
  s+=`<g fill="${color}" opacity="${zu}"><path d="${ZP}" transform="translate(107.730 218) scale(0.132 -0.132)"/><path d="${UP}" transform="translate(186.666 218) scale(0.132 -0.132)"/></g></svg>`;
  return s;
}
function tickState(t,start,period,startPos,count){
  if(t<start) return {active:-1,prev:-1,frac:1,k:-1,since:0};
  const k=Math.min(count-1,Math.floor((t-start)/period)); const since=t-(start+k*period);
  return {active:(startPos+k)%12, prev:k>0?(startPos+k-1)%12:-1, frac:clamp(since/0.22), k, since};
}
const CY=()=>WIDE()?H/2:960, RS=()=>WIDE()?620:760;
const center=(html,y)=>`<div class="abs" style="left:50%;top:${y}px;transform:translate(-50%,-50%)">${html}</div>`;
const NAMES=['Zone','Zuitzerland','muShanghai','Zanzalu','4Seas','ZuCity Japan','Valley of the Commons'];
const SCENES={
 hook(t,p){ if(t<1.5) return {bg:'#ffffff', html:center(`<img src="${p.img}" style="width:${WIDE()?900:760}px;display:block">`,CY())};
   const tt=t-1.5; const st= tt<0.7?{active:0,prev:-1,frac:1}:{active:1,prev:0,frac:clamp((tt-0.7)/0.22)};
   return {bg:CREAM, html:center(ring({size:RS(),...st}),CY())}; },
 blank(){ return {bg:CREAM, html:''}; },
 dots(t){ const scales=Array.from({length:12},(_,i)=>{const a=0.2+0.3*i; const k=clamp((t-a)/0.18); return k<=0?0:0.6+0.4*easeOut(k);}); const zu=clamp((t-3.2)/0.7);
   return {bg:CREAM, html:center(ring({size:RS(),active:-1,scales,zu}),CY())}; },
 lime(t){ const st=tickState(t,0.3,0.8,2,4); return {bg:CREAM, html:center(ring({size:RS(),...st}),CY())}; },
 lockup(t,p){ const names=p.names||NAMES, period=p.period||0.8, start=p.start??0.4, sp=p.startPos??6; const st=tickState(t,start,period,sp,names.length); const k=Math.max(0,st.k); const name=names[k]; const op=st.k<0?1:clamp(st.since/0.2); const dy=(1-easeOut(op))*16;
   const rs = st.k<0?{active:sp,prev:-1,frac:1}:st;
   if(WIDE()){ const RS=560, FS=124, GAP=64; const font=`600 ${FS}px 'Cormorant Garamond'`; const maxW=Math.max(...names.map(n=>textW(n,font))); const gw=RS+GAP+maxW; const left=(W-gw)/2, top=(H-RS)/2;
     return {bg:CREAM, html:`<div class="abs" style="left:${left}px;top:${top}px">${ring({size:RS,...rs})}</div><div class="abs serif" style="left:${left+RS+GAP}px;top:${top}px;height:${RS}px;display:flex;align-items:center;font-size:${FS}px;font-weight:600;letter-spacing:-1px;white-space:nowrap;color:${FOREST};opacity:${op};transform:translateX(${dy}px)">${name}</div>`}; }
   return {bg:CREAM, html:center(ring({size:560,...rs}),780)+`<div class="name" style="top:1110px;font-size:104px;color:${FOREST};opacity:${op};transform:translateY(${dy}px)">${name}</div>`}; },
 flip(t,p){ const inv=t>=1.0; const color=inv?CREAM:FOREST, bg=inv?FOREST:CREAM;
   if(t<1.6) return {bg, html:center(ring({size:RS(),color,active:0,prev:-1,frac:1}),CY())};
   const i=Math.min(2,Math.floor((t-1.6)/0.467));
   if(i===0) return {bg:CREAM, html:`<div class="abs" style="left:${WIDE()?360:60}px;right:${WIDE()?360:60}px;top:${WIDE()?320:740}px;height:440px;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(31,77,58,.15);overflow:hidden"><div style="height:116px;background:#E9E6DC;display:flex;align-items:flex-end;padding:0 30px"><div style="background:#fff;border-radius:22px 22px 0 0;padding:22px 34px;display:flex;align-items:center;gap:18px;font-size:36px;color:${FOREST};font-weight:500"><span class="serif" style="display:inline-flex;width:56px;height:56px;border-radius:50%;background:${CREAM};color:${FOREST};align-items:center;justify-content:center;font-weight:600;font-size:32px">Zu</span>Zuzone</div></div><div style="padding:44px 50px"><div style="width:100%;height:70px;border-radius:999px;background:#F2EFE6;padding:0 34px;line-height:70px;color:#8a948f;font-size:34px;box-sizing:border-box">zuzone.org</div></div></div>`};
   if(i===1) return {bg:CREAM, html: p.og ? center(`<img src="${p.og}" style="width:960px;border-radius:28px;box-shadow:0 20px 60px rgba(31,77,58,.18);display:block">`,CY()) : center(`<div style="width:960px;height:504px;border-radius:28px;background:${FOREST};display:flex;align-items:center;justify-content:center;gap:40px;color:${CREAM}">${ring({size:220,color:CREAM,active:2,prev:-1,frac:1})}<div class="serif" style="font-size:150px;font-weight:600;letter-spacing:-3px">Zuzone</div></div>`,CY())};
   return {bg:CREAM, html:`<div class="abs" style="left:0;right:0;top:${CY()-130}px;height:260px;background:${CREAM};border-top:3px solid #ECE7D8;border-bottom:3px solid #ECE7D8;display:flex;align-items:center;gap:36px;padding-left:${WIDE()?600:70}px">${ring({size:216,color:FOREST,active:3,prev:-1,frac:1})}<div class="serif" style="font-size:96px;font-weight:600;color:${FOREST};letter-spacing:-1px">Zanzalu</div></div>`}; },
 end(t,p){ const st=tickState(t,0.4,0.8,0,12); const s=st.k<0?{active:11,prev:-1,frac:1}:st;
   if(WIDE()){ const RS=520, FS=150, GAP=60; const nameW=textW('Zone',`600 ${FS}px 'Cormorant Garamond'`); const gw=RS+GAP+nameW; const left=(W-gw)/2, top=190;
     return {bg:FOREST, html:`<div class="abs" style="left:${left}px;top:${top}px">${ring({size:RS,color:CREAM,...s})}</div><div class="abs serif" style="left:${left+RS+GAP}px;top:${top}px;height:${RS}px;display:flex;align-items:center;font-size:${FS}px;font-weight:600;color:${CREAM};letter-spacing:-1px">Zone</div><div class="abs" style="left:0;right:0;top:${top+RS+70}px;text-align:center;font-size:46px;font-weight:500;color:${LIME};letter-spacing:1px">${p.url||''}</div>`}; }
   return {bg:FOREST, html:center(ring({size:640,color:CREAM,...s}),760)+`<div class="name" style="top:1150px;font-size:132px;color:${CREAM}">Zone</div><div class="abs" style="left:0;right:0;top:1370px;text-align:center;font-size:50px;font-weight:500;color:${LIME};letter-spacing:1px">${p.url||''}</div>`}; },
 tagline(t,p){ const op=clamp((t-0.1)/0.5); const st=tickState(t,0.3,0.8,0,12); const rs=st.k<0?{active:11,prev:-1,frac:1}:st;
   if(WIDE()) return {bg:FOREST, html:center(ring({size:240,color:CREAM,...rs}),300)+`<div class="abs serif" style="left:200px;right:200px;top:520px;text-align:center;font-size:92px;font-weight:600;line-height:1.1;color:${CREAM};letter-spacing:-1px;opacity:${op};text-wrap:balance">${p.text||'The home for permanent hubs and pop-up cities.'}</div>`};
   return {bg:FOREST, html:center(ring({size:300,color:CREAM,...rs}),560)+`<div class="abs serif" style="left:90px;right:90px;top:800px;text-align:center;font-size:104px;font-weight:600;line-height:1.08;color:${CREAM};letter-spacing:-1px;opacity:${op};text-wrap:balance">${p.text||'The home for permanent hubs and pop-up cities.'}</div>`}; },
 ownthing(t,p){ const o1=clamp((t-0.1)/0.5), o2=clamp((t-1.4)/0.5), o3=clamp((t-2.6)/0.5);
   const dotsHtml=(cx,cy,r)=>[[-1.1,-0.35,'#1F4D3A'],[0.95,-0.6,'#3F7D5C'],[-0.45,0.75,'#A86B2F'],[0.7,0.6,'#C4D63E'],[1.25,0.15,'#1F4D3A'],[-1.3,0.3,'#5E6E66']].map(([dx,dy,c],i)=>`<div class="abs" style="left:${cx+dx*r}px;top:${cy+dy*r}px;width:22px;height:22px;border-radius:50%;background:${c};opacity:${clamp((t-0.3-i*0.12)/0.3)};transform:translate(-50%,-50%)"></div>`).join('');
   if(WIDE()) return {bg:CREAM, html:[[-1.1,-1.6],[0.95,-1.45],[-0.45,1.55],[0.7,1.7],[1.25,-1.5],[-1.3,1.45]].map(([dx,dy],i)=>`<div class="abs" style="left:${W/2+dx*520}px;top:${H*0.5+dy*170}px;width:22px;height:22px;border-radius:50%;background:${['#1F4D3A','#3F7D5C','#A86B2F','#C4D63E','#1F4D3A','#5E6E66'][i]};opacity:${clamp((t-0.3-i*0.12)/0.3)};transform:translate(-50%,-50%)"></div>`).join('')+`<div class="abs serif" style="left:140px;right:140px;top:${H*0.5-140}px;text-align:center;font-size:120px;font-weight:600;line-height:1.05;color:${FOREST};letter-spacing:-2px;opacity:${o1}">${p.h||'Each hub is its own thing.'}</div><div class="abs" style="left:240px;right:240px;top:${H*0.5+40}px;text-align:center;font-size:40px;font-weight:500;line-height:1.35;color:#5E6E66;opacity:${o2}">${p.sub||'Its own identity, its own network, its own projects and affiliations.'}</div><div class="abs" style="left:0;right:0;top:${H*0.5+150}px;text-align:center;font-size:40px;font-weight:600;color:${FOREST};opacity:${o3}">${p.k||'Independent. Every one of them.'}</div>`};
   return {bg:CREAM, html:dotsHtml(540,760,330)+`<div class="abs serif" style="left:80px;right:80px;top:640px;text-align:center;font-size:128px;font-weight:600;line-height:1.05;color:${FOREST};letter-spacing:-2px;opacity:${o1};text-wrap:balance">${p.h||'Each hub is its own thing.'}</div><div class="abs" style="left:120px;right:120px;top:1010px;text-align:center;font-size:46px;font-weight:500;line-height:1.35;color:#5E6E66;opacity:${o2}">${p.sub||'Its own identity, its own network, its own projects and affiliations.'}</div><div class="abs" style="left:0;right:0;top:1230px;text-align:center;font-size:46px;font-weight:600;color:${FOREST};opacity:${o3}">${p.k||'Independent. Every one of them.'}</div>`}; },
 sharedzone(t,p){ const words=p.words||['Connect','Exchange knowledge','Town Halls','Support','Relationships']; const st=tickState(t,0.3,0.8,0,12); const rs=st.k<0?{active:11,prev:-1,frac:1}:st; const o1=clamp((t-0.1)/0.5);
   if(WIDE()){ const RS=440; const cx=W/2, cy=H*0.56; const R=RS/2+170; const angs=[-62,-18,30,150,210];
     const labels=words.map((w,i)=>{const a=angs[i]*Math.PI/180; const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a); const op=clamp((t-0.9-i*0.8)/0.3); const left=Math.cos(a)<-0.2; return `<div class="abs" style="left:${x}px;top:${y}px;transform:translate(${left?'-100%':'0'},-50%);font-size:40px;font-weight:600;color:${LIME};opacity:${op};white-space:nowrap">${w}</div>`;}).join('');
     return {bg:FOREST, html:`<div class="abs serif" style="left:100px;right:100px;top:90px;text-align:center;font-size:84px;font-weight:600;line-height:1.08;color:${CREAM};letter-spacing:-1px;opacity:${o1}">${p.h||'Zuzone is the shared zone.'}</div><div class="abs" style="left:${cx-RS/2}px;top:${cy-RS/2}px">${ring({size:RS,color:CREAM,...rs})}</div>${labels}`}; }
   const RS=400; const cx=W/2, cy=640; const labels=words.map((w,i)=>`<div class="abs" style="left:0;right:0;top:${930+i*84}px;text-align:center;font-size:48px;font-weight:600;color:${LIME};opacity:${clamp((t-0.9-i*0.8)/0.3)};white-space:nowrap">${w}</div>`).join('');
   return {bg:FOREST, html:`<div class="abs serif" style="left:80px;right:80px;top:250px;text-align:center;font-size:100px;font-weight:600;line-height:1.08;color:${CREAM};letter-spacing:-1px;opacity:${o1};text-wrap:balance">${p.h||'Zuzone is the shared zone.'}</div><div class="abs" style="left:${cx-RS/2}px;top:${cy-RS/2+70}px">${ring({size:RS,color:CREAM,...rs})}</div>${labels}`}; },
 caption(t,p){ const y=p.y||(WIDE()?H-215:1400); return {bg:'transparent', html:`<div class="cap" style="top:${y}px">${p.text||''}</div>`}; },
};
window.renderAt=function(scene,t,p){ p=p||{}; const st=document.getElementById('stage'); const r=SCENES[scene](t,p); st.style.background=r.bg; st.innerHTML=r.html; return true; };
const q=new URLSearchParams(location.search); if(q.get('scene')) renderAt(q.get('scene'),parseFloat(q.get('t')||'0'),Object.fromEntries(q));
</script></body></html>
